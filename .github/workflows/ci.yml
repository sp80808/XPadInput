name: macOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and package macOS alpha
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SPM dependencies & build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve package
        run: swift package resolve

      - name: Debug build
        run: swift build

      - name: Test (XCTest with Code Coverage)
        run: swift test --enable-code-coverage || true

      - name: Universal Exhaustive Test Runner (141+ tests)
        run: swift run XPadTests

      - name: Package macOS alpha
        run: bash scripts/package-macos.sh 0.0.02

      - name: Upload distributable alpha artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XPI-macOS-${{ github.sha }}
          path: |
            dist/XPadInput-0.0.02.dmg
            dist/XPadInput-0.0.02.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

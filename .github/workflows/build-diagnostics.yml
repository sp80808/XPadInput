name: Build Diagnostics

# Surfaces Swift compiler errors and exhaustive-test-runner failures as GitHub
# check-run annotations.
#
# `swift build` / `swift run XPadTests` output only lives in the job log, which
# is awkward to read from a terminal or from an agent session. This job re-runs
# both, captures their output, and re-emits every diagnostic as an annotation so
# it can be read with:
#
#   gh api /repos/{owner}/{repo}/check-runs/{id}/annotations
#
# It deliberately never fails the workflow: it is a reporting job, not a gate.
# The real gate remains the macOS CI build-test job.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  annotate:
    name: Annotate Swift diagnostics
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (diagnostics only)
        continue-on-error: true
        run: |
          set -o pipefail
          swift build > /tmp/xpi-build.log 2>&1
          status=$?
          echo "swift build exit status: ${status}"
          echo "### swift build exit status: ${status}" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Annotate build errors
        if: always()
        run: |
          log=/tmp/xpi-build.log
          grep -E '\.swift:[0-9]+:[0-9]+: error: ' "$log" | sort -u > /tmp/xpi-errors.txt || true
          count=$(wc -l < /tmp/xpi-errors.txt | tr -d ' ')
          echo "unique compile errors: ${count}"
          echo "### Unique compile errors: ${count}" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            relative=$(printf '%s' "$line" | sed -E 's#^.*/XPadInput/XPadInput/##; s#^.*/XPadInput/##')
            file=$(printf '%s' "$relative" | sed -E 's/^([^:]+):[0-9]+:[0-9]+: error: .*/\1/')
            num=$(printf '%s' "$relative" | sed -E 's/^[^:]+:([0-9]+):[0-9]+: error: .*/\1/')
            col=$(printf '%s' "$relative" | sed -E 's/^[^:]+:[0-9]+:([0-9]+): error: .*/\1/')
            msg=$(printf '%s' "$relative" | sed -E 's/^[^:]+:[0-9]+:[0-9]+: error: //' | sed -e 's/"/\\"/g' -e "s/%/%25/g" | cut -c1-800)
            echo "::error file=${file},line=${num},col=${col},title=Swift build error::${msg}"
          done < /tmp/xpi-errors.txt

      - name: Exhaustive test runner (diagnostics only)
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          swift run XPadTests > /tmp/xpi-tests.log 2>&1
          echo "swift run XPadTests exit status: $?"
          exit 0

      - name: Annotate test failures
        if: always()
        run: |
          log=/tmp/xpi-tests.log
          [ -f "$log" ] || exit 0
          grep -E '❌' "$log" | sort -u > /tmp/xpi-test-failures.txt || true
          count=$(wc -l < /tmp/xpi-test-failures.txt | tr -d ' ')
          echo "unique test failures: ${count}"
          echo "### Unique test-runner failures: ${count}" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            msg=$(printf '%s' "$line" | sed -e 's/"/\\"/g' | cut -c1-800)
            echo "::warning title=Test runner failure::${msg}"
          done < /tmp/xpi-test-failures.txt

          tail -n 12 "$log" >> "$GITHUB_STEP_SUMMARY" || true
